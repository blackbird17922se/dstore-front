<div class="account-menu-root">
  <button
    type="button"
    class="account-trigger"
    aria-label="Abrir menú de mi cuenta"
    aria-controls="dstore-account-popover"
    [attr.aria-expanded]="abierto"
    [attr.aria-haspopup]="'menu'"
    (click)="alternarMenu()">

    <span class="account-avatar" aria-hidden="true">{{ iniciales }}</span>

    <span class="account-trigger-label">
      <span class="account-username">{{ nombreVisible }}</span>
      <span class="account-role">{{ rolVisible }}</span>
    </span>

    <svg class="account-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m6 9 6 6 6-6"/>
    </svg>
  </button>

  @if (abierto) {
    <div id="dstore-account-popover" class="account-popover" role="menu" aria-label="Opciones de cuenta">
      <div class="account-popover-profile" role="presentation">
        <span class="account-avatar account-avatar-large" aria-hidden="true">{{ iniciales }}</span>
        <div class="account-popover-info">
          <strong class="account-popover-name">{{ nombreVisible }}</strong>
          <span class="account-popover-role">{{ rolVisible }}</span>
          @if (cargando && !perfil) {
            <span class="account-popover-hint">Cargando perfil…</span>
          }
        </div>
      </div>

      <div class="account-popover-actions">
        <a class="account-action" routerLink="/mi-perfil" role="menuitem" (click)="cerrarMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Mi perfil</span>
        </a>
        <button type="button" class="account-action account-logout" role="menuitem" (click)="cerrarSesion()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
          </svg>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </div>
  }
</div>

<div class="page-container perfil-container">

  <div class="page-header">
    <div>
      <h2>Mi perfil</h2>

      <p class="page-subtitle">
        Consulta y actualiza la información de tu cuenta.
      </p>
    </div>
  </div>


  @if (perfil) {

    <div class="perfil-grid">

      <!-- ======================================= -->
      <!-- DATOS PERSONALES -->
      <!-- ======================================= -->

      <section class="perfil-card">

        <h3>Información personal</h3>

        <form
          #perfilForm="ngForm"
          (ngSubmit)="guardarPerfil()">

          <div class="form-group">
            <label for="nombre">
              Nombre
            </label>

            <input
              id="nombre"
              type="text"
              name="nombre"
              [(ngModel)]="nombre"
              required
            />
          </div>


          <div class="form-group">
            <label for="apellido">
              Apellido
            </label>

            <input
              id="apellido"
              type="text"
              name="apellido"
              [(ngModel)]="apellido"
              required
            />
          </div>


          <div class="form-group">
            <label for="nombreUsuario">
              Nombre de usuario
            </label>

            <input
              id="nombreUsuario"
              type="text"
              [value]="perfil.nombreUsuario"
              disabled
            />

            <small class="form-help">
              El nombre de usuario no puede modificarse desde el perfil.
            </small>
          </div>


          <div class="form-group">
            <label for="rol">
              Rol
            </label>

            <input
              id="rol"
              type="text"
              [value]="perfil.nombreRol"
              disabled
            />
          </div>


          <button
            type="submit"
            class="btn-primary"
            [disabled]="perfilForm.invalid">

            Guardar cambios

          </button>

        </form>

      </section>


      <!-- ======================================= -->
      <!-- CONTRASEÑA -->
      <!-- ======================================= -->

      <section class="perfil-card">

        <h3>Seguridad</h3>

        <p class="card-description">
          Cambia la contraseña utilizada para ingresar al sistema.
        </p>


        <form
          #contrasenaForm="ngForm"
          (ngSubmit)="guardarContrasena()">

          <div class="form-group">
            <label for="contrasenaActual">
              Contraseña actual
            </label>

            <input
              id="contrasenaActual"
              type="password"
              name="contrasenaActual"
              [(ngModel)]="contrasenaActual"
              required
            />
          </div>


          <div class="form-group">
            <label for="nuevaContrasena">
              Nueva contraseña
            </label>

            <input
              id="nuevaContrasena"
              type="password"
              name="nuevaContrasena"
              [(ngModel)]="nuevaContrasena"
              required
              minlength="6"
            />
          </div>


          <div class="form-group">
            <label for="confirmarContrasena">
              Confirmar nueva contraseña
            </label>

            <input
              id="confirmarContrasena"
              type="password"
              name="confirmarContrasena"
              [(ngModel)]="confirmarContrasena"
              required
              minlength="6"
            />
          </div>


          <button
            type="submit"
            class="btn-primary"
            [disabled]="contrasenaForm.invalid">

            Cambiar contraseña

          </button>

        </form>

      </section>

    </div>

  } @else {

    <div class="empty-message">
      Cargando información del perfil...
    </div>

  }

</div>

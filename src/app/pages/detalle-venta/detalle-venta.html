<div class="detalle-venta-container">
    <h2>Detalle Venta</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio Unitario</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
            @for (venta of detalleVentas; track venta.id) {
            <tr>
                <td>{{ venta.id }}</td>
                <td>{{ venta.producto}}</td>
                <td>{{ venta.cantidad}}</td>
                <td>{{ venta.precioUnitario}}</td>
                <td>{{ venta.subtotal}}</td>
            </tr>
            }
        </tbody>
    </table>
</div>

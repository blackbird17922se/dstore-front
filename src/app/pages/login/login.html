<div class="login-container">
  <h2>Iniciar sesión</h2>
  <form (ngSubmit)="login()" #loginForm="ngForm">

    <label for="username">Usuario</label>
    <input type="text" id="username" name="username" [(ngModel)]="nombreUsuario" required />

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" [(ngModel)]="contrasena" required />

    <button type="submit" [disabled]="loginForm.invalid">Ingresar</button>
  </form>
</div>

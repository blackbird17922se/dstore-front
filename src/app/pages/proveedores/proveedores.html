<div class="proveedores-container">
  <h2>Proveedores</h2>
  <button (click)="abrirModal()">➕ Crear proveedor</button>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Correo</th>
        <th>Dirección</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let proveedor of proveedores">
        <td>{{ proveedor.id }}</td>
        <td>{{ proveedor.nombre }}</td>
        <td>{{ proveedor.telefono }}</td>
        <td>{{ proveedor.correo }}</td>
        <td>{{ proveedor.direccion }}</td>
        <td>
          <button (click)="editarProveedor(proveedor)">✏️ Editar</button>
          <button (click)="borrarProveedor(proveedor.id)">🗑️ Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Modal -->
  <div class="modal" *ngIf="modalAbierto">
    <div class="modal-content">
      <h3>{{ editando ? 'Editar Proveedor' : 'Crear Proveedor' }}</h3>

      <!-- FORMULARIO -->
      <form #formProveedor="ngForm" (ngSubmit)="guardarProveedor()">

        <input
          type="text"
          name="nombre"
          placeholder="Nombre del proveedor"
          [(ngModel)]="proveedorActual.nombre"
          required
          #nombre="ngModel"
        />
        <div *ngIf="nombre.invalid && nombre.touched" class="error">
          ⚠️ El nombre es obligatorio.
        </div>

        <input
          type="number"
          name="telefono"
          placeholder="Teléfono del proveedor"
          [(ngModel)]="proveedorActual.telefono"
        />

        <input
          type="email"
          name="correo"
          placeholder="Correo del proveedor"
          [(ngModel)]="proveedorActual.correo"
          email
        />

        <input
          type="text"
          name="direccion"
          placeholder="Dirección del proveedor"
          [(ngModel)]="proveedorActual.direccion"
        />

        <div class="buttons">
          <button type="submit" [disabled]="formProveedor.invalid">
            {{ editando ? 'Guardar cambios' : 'Crear' }}
          </button>
          <button type="button" (click)="cerrarModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
